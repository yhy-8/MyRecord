name: Build Executable

on:
  push:
  workflow_dispatch:

jobs:
  build-client-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Debug - list files
        run: dir

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure UTF-8 console
        run: chcp 65001

      - name: Install dependencies
        run: |
          pip install -r client/requirements.txt
          pip install pyinstaller

      - name: Run tests
        timeout-minutes: 5
        run: python -m unittest discover -s tests -v

      # 两端架构：client/ 是唯一打包目标（服务端走 systemd，不打 exe）。
      # 入口取 client/__main__.py（等价 `python -m client`）。把配置**模板**与凭据样板
      # 放到 exe 同级目录：打包版从 sys.executable 旁读取 config.yaml/credentials/状态/data
      # （见 client/config.py / identity.py / sync.py 的 sys.frozen 分支），不读临时 _MEIPASS。
      # config.yaml 是用户配置（已 gitignore），这里用 config.example.yaml 模板生成一份,使用者改即可。
      # 客户端现在复用 server/hub/render.py 与 common/atomic_write.py（--paths . 从仓库根
      # 解析并打包进 exe），不依赖外部 server 工程。
      - name: Build client executable
        run: |
          pyinstaller --onefile --clean --name MyRecord --paths . `
            --hidden-import=yaml --exclude-module termios --exclude-module tty `
            client/__main__.py
          Copy-Item client\config.example.yaml dist\config.yaml
          Copy-Item client\credentials.example.json dist\credentials.example.json
          dir dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyRecord-windows-client
          path: dist/
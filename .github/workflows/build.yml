name: Build Executable

on:
  push:
  workflow_dispatch:

jobs:
  build-client-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Debug - list files
        run: dir

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure UTF-8 console
        run: chcp 65001

      - name: Install dependencies
        run: |
          pip install -r client/requirements.txt
          pip install pyinstaller

      - name: Run tests
        timeout-minutes: 5
        run: python -m unittest discover -s tests -v

      # 新的两端架构：client/ 是唯一打包目标（服务端走 systemd，不打 exe）。
      # 入口取 client/__main__.py（等价 `python -m client`）；把 client/config.yaml 一并打进包。
      - name: Build client executable
        run: |
          pyinstaller --onefile --clean --name AgentRecord --paths . `
            --hidden-import=yaml --exclude-module termios --exclude-module tty `
            --add-data "client/config.yaml;client" client/__main__.py
          Copy-Item client\config.yaml dist\config.yaml
          dir dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentRecord-windows-client
          path: dist/